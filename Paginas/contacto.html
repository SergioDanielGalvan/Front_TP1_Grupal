<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="../img/logo.png" alt="Logo MocoSoft" class="logo-img">
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="../index.html">Inicio</a></li>

    </ul>
  </nav>

  <section class="contact-container" id="contacto">
    <h2>Contáctanos</h2>
    <form class="contact-form" action="#" method="post">
      <input type="text" name="nombre" placeholder="Tu nombre" required>
      <input type="email" name="email" placeholder="Tu correo electrónico" required>
      <textarea name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
      <button type="submit">Enviar Mensaje</button>
    </form>
  </section>
