<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | MocoSoft</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.png" alt="Logo MocoSoft" class="logo-img">
            </a>
        </div>
        <button class="menu-toggle" id="mobile-menu" aria-label="Abrir menú">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <ul class="nav-links" id="nav-list">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="index.html#nosotros">Nosotros</a></li>
            <li><a href="bitacora.html">Bitácora</a></li>
            <li><a href="contacto.html" class="activeS">Contacto</a></li>
        </ul>
    </nav>

    <main class="profile-container">
    <section class="card-individual">
        <h2>Contáctanos</h2>
        <p style="margin-bottom: 20px;">¿Tenés alguna consulta o propuesta? Dejanos tu mensaje.</p>
        
        <form class="contact-form" id="contact-form" action="#" method="post">
            <input type="text" name="nombre" placeholder="Tu nombre" required>
            <input type="email" name="email" placeholder="Tu correo electrónico" required>
            <textarea name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
            <button type="submit" class="btn-primary" id="btn-enviar">Enviar Mensaje</button>
        </form>
        
        <!-- Elemento para mostrar el mensaje de éxito) -->
        <div id="mensaje-exito" class="hidden" style="margin-top: 20px; color: var(--accent); font-weight: 600;">
            ¡Gracias por escribirnos! Te responderemos a la brevedad.
        </div>
        
        <button id="dark-mode-toggle" class="btn-primary" style="margin-top: 30px;">Modo Oscuro</button>
    </section>
    </main>
    <footer>
        <p>&copy; 2026 MocoSoft - Todos los derechos reservados - Trabajo Práctico 1</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
